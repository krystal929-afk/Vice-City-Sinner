<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Out of the Foxhole editorial art</title><desc id="d">Vice City Sinner editorial graphic using black, magenta, acid green, white serif type, thin borders and field-note motifs.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#050505"/><stop offset="1" stop-color="#100812"/></linearGradient><pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#ef35ff" stroke-opacity=".09"/></pattern></defs><rect width="1200" height="800" fill="url(#g)"/><rect width="1200" height="800" fill="url(#grid)"/><rect x="34" y="34" width="1132" height="732" fill="none" stroke="#ef35ff" stroke-width="2"/><text x="70" y="88" fill="#86ff2d" font-family="Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="5">FEATURED ESSAY / ISSUE 001</text><line x1="70" y1="112" x2="1130" y2="112" stroke="#86ff2d" stroke-opacity=".45"/><text x="72" y="238" fill="#f6f0f6" font-family="Georgia, serif" font-weight="700" font-size="92">OUT OF THE</text><text x="72" y="340" fill="#86ff2d" font-family="Georgia, serif" font-weight="700" font-size="112">FOXHOLE</text><text x="72" y="402" fill="#ef35ff" font-family="Arial, sans-serif" font-weight="700" font-size="24" letter-spacing="3">ACCOUNTABILITY / SURVIVAL MODE / REAL LIFE</text><g transform="translate(72 470)"><rect width="340" height="170" fill="#09090a" stroke="#6e626f"/><text x="24" y="44" fill="#ef35ff" font-family="Georgia, serif" font-size="54" font-weight="700">01</text><text x="98" y="42" fill="#f6f0f6" font-family="Arial, sans-serif" font-size="19" font-weight="700">THE WAR IS OVER</text><line x1="98" y1="58" x2="300" y2="58" stroke="#86ff2d"/><text x="98" y="88" fill="#c7bdca" font-family="Arial, sans-serif" font-size="16">Stop treating peace</text><text x="98" y="112" fill="#c7bdca" font-family="Arial, sans-serif" font-size="16">like evidence of danger.</text></g><g transform="translate(435 470)"><rect width="340" height="170" fill="#09090a" stroke="#6e626f"/><text x="24" y="44" fill="#ef35ff" font-family="Georgia, serif" font-size="54" font-weight="700">02</text><text x="98" y="42" fill="#f6f0f6" font-family="Arial, sans-serif" font-size="19" font-weight="700">LOOK INWARD</text><line x1="98" y1="58" x2="300" y2="58" stroke="#86ff2d"/><text x="98" y="88" fill="#c7bdca" font-family="Arial, sans-serif" font-size="16">Pattern recognition</text><text x="98" y="112" fill="#c7bdca" font-family="Arial, sans-serif" font-size="16">works both directions.</text></g><g transform="translate(798 470)"><rect width="330" height="170" fill="#09090a" stroke="#6e626f"/><text x="24" y="44" fill="#ef35ff" font-family="Georgia, serif" font-size="54" font-weight="700">03</text><text x="98" y="42" fill="#f6f0f6" font-family="Arial, sans-serif" font-size="19" font-weight="700">CLIMB OUT</text><line x1="98" y1="58" x2="290" y2="58" stroke="#86ff2d"/><text x="98" y="88" fill="#c7bdca" font-family="Arial, sans-serif" font-size="16">The apology starts</text><text x="98" y="112" fill="#c7bdca" font-family="Arial, sans-serif" font-size="16">after the words.</text></g><text x="72" y="718" fill="#ef35ff" font-family="Georgia, serif" font-style="italic" font-size="31">The danger can be over before your body believes it.</text></svg>