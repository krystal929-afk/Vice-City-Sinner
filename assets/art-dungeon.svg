<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Who the Fuck Invented the Dungeon?</title><desc id="d">Vice City Sinner kink history graphic using a blueprint grid, historical nodes and line-art dungeon furniture.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ef35ff" stroke-opacity=".11"/></pattern></defs><rect width="1200" height="800" fill="#050505"/><rect width="1200" height="800" fill="url(#grid)"/><rect x="34" y="34" width="1132" height="732" fill="none" stroke="#ef35ff" stroke-width="2"/><text x="70" y="84" fill="#86ff2d" font-family="Arial,sans-serif" font-weight="700" font-size="20" letter-spacing="5">KINK HISTORY / ORIGINS / NO SINGLE INVENTOR</text><text x="70" y="182" fill="#ef35ff" font-family="Georgia,serif" font-weight="700" font-size="112">03</text><text x="220" y="162" fill="#f6f0f6" font-family="Georgia,serif" font-weight="700" font-size="64">WHO THE FUCK</text><text x="220" y="230" fill="#f6f0f6" font-family="Georgia,serif" font-weight="700" font-size="64">INVENTED THE DUNGEON?</text><g transform="translate(72 300)" fill="none" stroke="#86ff2d" stroke-width="5"><path d="M86 0v210M0 42h172M18 16l136 168M154 16L18 184"/><circle cx="86" cy="106" r="12" fill="#ef35ff" stroke="none"/></g><g font-family="Arial,sans-serif" font-weight="700"><g transform="translate(300 310)"><rect width="250" height="112" fill="#0b0b0c" stroke="#6e646f"/><text x="18" y="32" fill="#ef35ff" font-size="16">1950s–70s</text><text x="18" y="62" fill="#f6f0f6" font-size="22">LEATHER + CLUBS</text><text x="18" y="88" fill="#86ff2d" font-size="14">COMMUNITY → SPACE</text></g><g transform="translate(580 310)"><rect width="250" height="112" fill="#0b0b0c" stroke="#6e646f"/><text x="18" y="32" fill="#ef35ff" font-size="16">1970s</text><text x="18" y="62" fill="#f6f0f6" font-size="22">DIY FURNITURE</text><text x="18" y="88" fill="#86ff2d" font-size="14">BUILT TO PURPOSE</text></g><g transform="translate(860 310)"><rect width="270" height="112" fill="#0b0b0c" stroke="#6e646f"/><text x="18" y="32" fill="#ef35ff" font-size="16">1980s–90s</text><text x="18" y="62" fill="#f6f0f6" font-size="22">ACTIVISM + SAFETY</text><text x="18" y="88" fill="#86ff2d" font-size="14">RULES / RISK / CARE</text></g><g transform="translate(300 448)"><rect width="250" height="112" fill="#0b0b0c" stroke="#6e646f"/><text x="18" y="32" fill="#ef35ff" font-size="16">1990s</text><text x="18" y="62" fill="#f6f0f6" font-size="22">THE INTERNET</text><text x="18" y="88" fill="#86ff2d" font-size="14">PRIVATE → FINDABLE</text></g><g transform="translate(580 448)"><rect width="550" height="112" fill="#0b0b0c" stroke="#ef35ff"/><text x="18" y="30" fill="#86ff2d" font-size="15" letter-spacing="2">THE ACTUAL ANSWER</text><text x="18" y="66" fill="#f6f0f6" font-family="Georgia,serif" font-size="28">Nobody.</text><text x="18" y="96" fill="#f6f0f6" font-family="Georgia,serif" font-size="28">Communities built it together.</text></g></g><line x1="70" y1="620" x2="1130" y2="620" stroke="#f6f0f6"/><text x="70" y="666" fill="#ef35ff" font-family="Georgia,serif" font-weight="700" font-size="27">PRIVATE CLUBS / LEATHER BARS / DIY EQUIPMENT</text><text x="70" y="700" fill="#ef35ff" font-family="Georgia,serif" font-weight="700" font-size="27">ACTIVISM / INTERNET / SHARED RULES</text><text x="70" y="736" fill="#c7bdca" font-family="Arial,sans-serif" font-size="18">A modern dungeon is accumulated history, not a medieval hand-me-down.</text></svg>