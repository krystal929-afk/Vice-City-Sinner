<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Nine No-Brainer Hair Metal Revival Combos</title><desc id="d">Vice City Sinner style-guide graphic with black editorial base, magenta numbering, acid-green accents and wardrobe tiles.</desc><rect width="1200" height="800" fill="#050505"/><rect x="34" y="34" width="1132" height="732" fill="none" stroke="#ef35ff" stroke-width="2"/><text x="70" y="84" fill="#86ff2d" font-family="Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="5">STYLE / THE QUICK GUIDE</text><text x="70" y="170" fill="#f6f0f6" font-family="Georgia, serif" font-weight="700" font-size="68">NINE NO-BRAINER</text><text x="70" y="242" fill="#f6f0f6" font-family="Georgia, serif" font-weight="700" font-size="68">HAIR METAL REVIVAL COMBOS</text><text x="70" y="285" fill="#c7bdca" font-family="Arial, sans-serif" font-size="22">Wake up an all-black wardrobe without buying an entirely new personality.</text><g font-family="Arial, sans-serif" font-weight="700"><g transform="translate(70 330)"><rect width="330" height="140" fill="#0b0b0c" stroke="#756b78"/><text x="18" y="54" fill="#ef35ff" font-family="Georgia,serif" font-size="58">1</text><text x="82" y="42" fill="#fff" font-size="20">THE SATANICA DEFAULT</text><text x="82" y="72" fill="#86ff2d" font-size="15">BLACK / FISHNET / SILVER</text><path d="M24 104h280" stroke="#ef35ff" stroke-opacity=".4"/></g><g transform="translate(435 330)"><rect width="330" height="140" fill="#0b0b0c" stroke="#756b78"/><text x="18" y="54" fill="#ef35ff" font-family="Georgia,serif" font-size="58">2</text><text x="82" y="42" fill="#fff" font-size="20">BAND TEE, BUT HOT</text><text x="82" y="72" fill="#86ff2d" font-size="15">TEE / BELT / CHAINS</text><path d="M24 104h280" stroke="#ef35ff" stroke-opacity=".4"/></g><g transform="translate(800 330)"><rect width="330" height="140" fill="#0b0b0c" stroke="#756b78"/><text x="18" y="54" fill="#ef35ff" font-family="Georgia,serif" font-size="58">3</text><text x="82" y="42" fill="#fff" font-size="20">LEATHER DOES THE WORK</text><text x="82" y="72" fill="#86ff2d" font-size="15">JACKET / CHAINS / BOOTS</text><path d="M24 104h280" stroke="#ef35ff" stroke-opacity=".4"/></g><g transform="translate(70 490)"><rect width="330" height="140" fill="#0b0b0c" stroke="#756b78"/><text x="18" y="54" fill="#ef35ff" font-family="Georgia,serif" font-size="58">4</text><text x="82" y="42" fill="#fff" font-size="20">ONE VIOLENT COLOR</text><text x="82" y="72" fill="#86ff2d" font-size="15">BLACK + ELECTRIC ACCENT</text><path d="M24 104h280" stroke="#ef35ff" stroke-opacity=".4"/></g><g transform="translate(435 490)"><rect width="330" height="140" fill="#0b0b0c" stroke="#756b78"/><text x="18" y="54" fill="#ef35ff" font-family="Georgia,serif" font-size="58">5</text><text x="82" y="42" fill="#fff" font-size="20">HAIR IS THE OUTFIT</text><text x="82" y="72" fill="#86ff2d" font-size="15">COLOR / BRAIDS / METAL</text><path d="M24 104h280" stroke="#ef35ff" stroke-opacity=".4"/></g><g transform="translate(800 490)"><rect width="330" height="140" fill="#0b0b0c" stroke="#756b78"/><text x="18" y="54" fill="#ef35ff" font-family="Georgia,serif" font-size="58">6</text><text x="82" y="42" fill="#fff" font-size="20">LACE AND DAMAGE</text><text x="82" y="72" fill="#86ff2d" font-size="15">LACE / DENIM / COMBAT BOOTS</text><path d="M24 104h280" stroke="#ef35ff" stroke-opacity=".4"/></g></g><line x1="70" y1="676" x2="1130" y2="676" stroke="#f6f0f6"/><text x="70" y="720" fill="#ef35ff" font-family="Georgia,serif" font-weight="700" font-size="30">THE RULE:</text><text x="230" y="720" fill="#f6f0f6" font-family="Georgia,serif" font-size="28">Start with what you already wear. Add drama, texture, and one thing that feels excessive.</text></svg>