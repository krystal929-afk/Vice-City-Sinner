<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Nine No-Brainer Hair Metal Revival Combos</title><desc id="d">Vice City Sinner style-guide graphic with black editorial base, magenta numbering, acid-green accents and nine wardrobe tiles.</desc><rect width="1200" height="800" fill="#050505"/><rect x="34" y="34" width="1132" height="732" fill="none" stroke="#ef35ff" stroke-width="2"/><text x="70" y="82" fill="#86ff2d" font-family="Arial,sans-serif" font-weight="700" font-size="19" letter-spacing="5">STYLE / THE QUICK GUIDE</text><text x="70" y="155" fill="#f6f0f6" font-family="Georgia,serif" font-weight="700" font-size="62">NINE NO-BRAINER</text><text x="70" y="220" fill="#f6f0f6" font-family="Georgia,serif" font-weight="700" font-size="62">HAIR METAL REVIVAL COMBOS</text><text x="70" y="258" fill="#c7bdca" font-family="Arial,sans-serif" font-size="20">Wake up an all-black wardrobe without buying an entirely new personality.</text><g font-family="Arial,sans-serif" font-weight="700"><g transform="translate(70 300)"><rect width="330" height="96" fill="#0b0b0c" stroke="#756b78"/><text x="16" y="50" fill="#ef35ff" font-family="Georgia,serif" font-size="52">1</text><text x="72" y="34" fill="#fff" font-size="17">THE SATANICA DEFAULT</text><text x="72" y="62" fill="#86ff2d" font-size="13">BLACK / FISHNET / SILVER</text></g><g transform="translate(435 300)"><rect width="330" height="96" fill="#0b0b0c" stroke="#756b78"/><text x="16" y="50" fill="#ef35ff" font-family="Georgia,serif" font-size="52">2</text><text x="72" y="34" fill="#fff" font-size="17">BAND TEE, BUT HOT</text><text x="72" y="62" fill="#86ff2d" font-size="13">TEE / BELT / CHAINS</text></g><g transform="translate(800 300)"><rect width="330" height="96" fill="#0b0b0c" stroke="#756b78"/><text x="16" y="50" fill="#ef35ff" font-family="Georgia,serif" font-size="52">3</text><text x="72" y="34" fill="#fff" font-size="17">LEATHER DOES THE WORK</text><text x="72" y="62" fill="#86ff2d" font-size="13">JACKET / CHAINS / BOOTS</text></g><g transform="translate(70 414)"><rect width="330" height="96" fill="#0b0b0c" stroke="#756b78"/><text x="16" y="50" fill="#ef35ff" font-family="Georgia,serif" font-size="52">4</text><text x="72" y="34" fill="#fff" font-size="17">ONE VIOLENT COLOR</text><text x="72" y="62" fill="#86ff2d" font-size="13">BLACK + ELECTRIC ACCENT</text></g><g transform="translate(435 414)"><rect width="330" height="96" fill="#0b0b0c" stroke="#756b78"/><text x="16" y="50" fill="#ef35ff" font-family="Georgia,serif" font-size="52">5</text><text x="72" y="34" fill="#fff" font-size="17">HAIR IS THE OUTFIT</text><text x="72" y="62" fill="#86ff2d" font-size="13">COLOR / BRAIDS / METAL</text></g><g transform="translate(800 414)"><rect width="330" height="96" fill="#0b0b0c" stroke="#756b78"/><text x="16" y="50" fill="#ef35ff" font-family="Georgia,serif" font-size="52">6</text><text x="72" y="34" fill="#fff" font-size="17">LACE AND DAMAGE</text><text x="72" y="62" fill="#86ff2d" font-size="13">LACE / DENIM / BOOTS</text></g><g transform="translate(70 528)"><rect width="330" height="96" fill="#0b0b0c" stroke="#756b78"/><text x="16" y="50" fill="#ef35ff" font-family="Georgia,serif" font-size="52">7</text><text x="72" y="34" fill="#fff" font-size="16">MAXIMUM JEWELRY</text><text x="72" y="62" fill="#86ff2d" font-size="13">RINGS / CUFFS / CHAINS</text></g><g transform="translate(435 528)"><rect width="330" height="96" fill="#0b0b0c" stroke="#756b78"/><text x="16" y="50" fill="#ef35ff" font-family="Georgia,serif" font-size="52">8</text><text x="72" y="34" fill="#fff" font-size="16">FIVE-MINUTE FULL VOLUME</text><text x="72" y="62" fill="#86ff2d" font-size="13">LEATHER / PLATFORM / LIP</text></g><g transform="translate(800 528)"><rect width="330" height="96" fill="#0b0b0c" stroke="#756b78"/><text x="16" y="50" fill="#ef35ff" font-family="Georgia,serif" font-size="52">9</text><text x="72" y="34" fill="#fff" font-size="17">FEELING KINKY?</text><text x="72" y="62" fill="#86ff2d" font-size="13">PASTIES / MINI / THIGH-HIGHS</text></g></g><line x1="70" y1="660" x2="1130" y2="660" stroke="#f6f0f6"/><text x="70" y="703" fill="#ef35ff" font-family="Georgia,serif" font-weight="700" font-size="26">THE RULE:</text><text x="210" y="703" fill="#f6f0f6" font-family="Georgia,serif" font-size="22">Start with what you already wear. Add drama, texture, and one thing that feels excessive.</text></svg>