<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Wait, What’s Your Real Name?</title><desc id="d">Vice City Sinner identity graphic with scene-name cards, redactions, magenta numbering and acid-green accents.</desc><rect width="1200" height="800" fill="#050505"/><rect x="34" y="34" width="1132" height="732" fill="none" stroke="#ef35ff" stroke-width="2"/><text x="70" y="84" fill="#86ff2d" font-family="Arial,sans-serif" font-weight="700" font-size="20" letter-spacing="5">CULTURE / IDENTITY / SCENE NAMES</text><text x="70" y="205" fill="#ef35ff" font-family="Georgia,serif" font-weight="700" font-size="120">02</text><text x="225" y="174" fill="#f6f0f6" font-family="Georgia,serif" font-weight="700" font-size="76">WAIT, WHAT’S</text><text x="225" y="252" fill="#f6f0f6" font-family="Georgia,serif" font-weight="700" font-size="76">YOUR REAL NAME?</text><g transform="translate(70 330)"><rect width="1060" height="96" fill="#0c0c0d" stroke="#6f6672"/><text x="28" y="34" fill="#86ff2d" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">LEGAL NAME</text><rect x="28" y="52" width="500" height="22" fill="#f6f0f6"/><rect x="544" y="52" width="110" height="22" fill="#ef35ff" opacity=".65"/><text x="840" y="63" fill="#c7bdca" font-family="Arial,sans-serif" font-size="18">REDACTED</text></g><g transform="translate(70 448)"><rect width="1060" height="112" fill="#0c0c0d" stroke="#ef35ff"/><text x="28" y="34" fill="#86ff2d" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">SCENE NAME</text><text x="28" y="82" fill="#f6f0f6" font-family="Georgia,serif" font-size="54" font-weight="700">SATANICA LUX</text><text x="840" y="76" fill="#ef35ff" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">CHOSEN / LIVED / REAL</text></g><g transform="translate(70 582)"><rect width="510" height="104" fill="#0c0c0d" stroke="#6f6672"/><text x="24" y="30" fill="#86ff2d" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2">PRIVACY</text><text x="24" y="68" fill="#f6f0f6" font-family="Georgia,serif" font-size="30">A boundary is not a confession.</text></g><g transform="translate(620 582)"><rect width="510" height="104" fill="#0c0c0d" stroke="#6f6672"/><text x="24" y="30" fill="#86ff2d" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2">SELF-AUTHORSHIP</text><text x="24" y="68" fill="#f6f0f6" font-family="Georgia,serif" font-size="30">Sometimes you get to pick.</text></g><text x="70" y="732" fill="#ef35ff" font-family="Georgia,serif" font-style="italic" font-size="27">The name on the paperwork is not always the whole story.</text></svg>