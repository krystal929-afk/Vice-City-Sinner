name: Install approved homepage hero

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-approved-homepage-hero.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install approved full-resolution hero
        shell: bash
        env:
          HERO_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-d19c-81f5-a474-fefc6ff418e6/raw?se=2026-09-16T13%3A41%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=1043df6c-1439-5fcb-a6c2-369d85386750&skoid=77636ecc-ad8d-44df-baa7-163b524a0261&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T10%3A35%3A23Z&ske=2026-09-17T10%3A35%3A23Z&sks=b&skv=2026-02-06&sig=DJdVPUTasiOUF6s7bp1e4eVPaYZ030hx0Wcl4x5ccR8%3D'
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$HERO_URL" -o assets/homepage-hero-satanica.png
          echo '6c6aef9cade30628474be7bab486ae18578ea9cd370b3dcddd6fa043673705bb  assets/homepage-hero-satanica.png' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import struct

          # Validate the exact PNG dimensions before publishing.
          p = Path('assets/homepage-hero-satanica.png')
          data = p.read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n', 'Hero is not a valid PNG'
          width, height = struct.unpack('>II', data[16:24])
          assert (width, height) == (1448, 1086), (width, height)

          index = Path('index.html')
          html = index.read_text()
          old = '<div class="home-hero-photo"><img src="assets/homepage-hero-satanica.avif" alt="Green Satanica emerging from a dark trench into bright South Florida light" fetchpriority="high"></div>'
          new = '<div class="home-hero-photo"><img src="assets/homepage-hero-satanica.png" alt="Green Satanica climbing from a dark underground passage into bright South Florida daylight" width="1448" height="1086" fetchpriority="high"></div>'
          if old not in html:
              raise SystemExit('Expected homepage hero markup not found')
          index.write_text(html.replace(old, new, 1))

          guide = Path('STYLE-GUIDE.md')
          text = guide.read_text()
          text = text.replace('`assets/homepage-hero-satanica.avif`', '`assets/homepage-hero-satanica.png`')
          text = text.replace(
              'The homepage hero uses the approved green Satanica imagery: Satanica emerging from a dark trench/foxhole toward bright South Florida light. Use this exact approved hero for the homepage feature. Show the composition cleanly and do not replace it with an unapproved portrait, generic goth imagery, a poster treatment, or a stretched low-resolution source.',
              'The homepage hero uses the approved green Satanica imagery: Satanica climbing clearly out of a dark underground passage/foxhole into bright South Florida daylight. Her hands and raised knee are visibly braced on the opening so the action reads immediately rather than looking like she is crawling in dirt. Use this exact approved 1448×1086 hero for the homepage feature. Show the full 4:3 composition cleanly and do not replace it with an unapproved portrait, generic goth imagery, a poster treatment, or a stretched low-resolution source.'
          )
          guide.write_text(text)
          PY
          rm -f assets/homepage-hero-satanica.avif
          rm -f .github/workflows/install-approved-homepage-hero.yml

      - name: Validate implementation
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'assets/homepage-hero-satanica.png' index.html
          grep -q 'width="1448" height="1086"' index.html
          grep -q 'homepage-hero-satanica.png' STYLE-GUIDE.md
          ! grep -q 'homepage-hero-satanica.avif' index.html
          test ! -e assets/homepage-hero-satanica.avif

      - name: Commit approved hero
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Lock and install redesigned homepage hero'
          git push origin main

      - name: Remove obsolete branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            chat-finish-homepage \
            final-art-lock \
            fix-unapproved-assets-and-style \
            hair-metal-header-and-guide-fix \
            homepage-hero-approved \
            integrate-hair-metal-guide-images \
            integrate-hair-metal-guide-images-2 \
            issue-001-redesign \
            newsletter-signup-ready \
            noop \
            remove-posters-surface-style-guide \
            repair-corrupt-image-assets \
            vcs-blog-redesign \
            vcs-editorial-profile-pass
          do
            git push origin --delete "$branch" || true
          done
