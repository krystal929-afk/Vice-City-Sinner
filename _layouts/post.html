---
layout: default
---
<article class="post shell">
  <header class="post-header">
    <div class="eyebrow">{{ page.category | default: 'Story' }}</div>
    <h1>{{ page.title }}</h1>
    {% if page.excerpt %}<p class="post-dek">{{ page.excerpt }}</p>{% endif %}
    <div class="post-meta">By Satanica Lux{% if page.date %} · {{ page.date | date: '%B %-d, %Y' }}{% endif %}</div>
  </header>

  {% if page.hero %}
  <figure class="post-hero">
    <img src="{{ page.hero | relative_url }}" alt="{{ page.hero_alt | default: page.title }}">
  </figure>
  {% endif %}

  <div class="post-body">
    {{ content }}
  </div>

  <footer class="post-footer">
    <a href="{{ '/' | relative_url }}#latest">← Back to stories</a>
  </footer>
</article>
